name: Build and release

on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            shell: bash
          - platform: windows-x64
            runner: windows-2022
            shell: msys2 {0}
          - platform: macos-arm64
            runner: macos-15
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Preserve Unix line endings in submodules
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libdbus-1-dev xvfb

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja nasm

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python

      - name: Build FFmpeg
        working-directory: external/FFmpeg
        run: |
          ./configure --disable-autodetect --disable-ffplay --disable-ffprobe --disable-doc --disable-everything --enable-decoder=xma2 --enable-demuxer=wav --enable-muxer=wav --enable-encoder=pcm_s16le --enable-protocol=file --enable-filter=aresample,aformat,anull
          make -j2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPKZGUI_BUILD_TESTS=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ctest --test-dir build --output-on-failure --timeout 120
          else
            ctest --test-dir build --output-on-failure --timeout 120
          fi

      - name: Package
        env:
          PACKAGE_NAME: pkzgui-${{ matrix.platform }}
        run: |
          cpack --config build/CPackConfig.cmake -B build/packages -D "CPACK_PACKAGE_FILE_NAME=$PACKAGE_NAME"
          extension=tar.gz
          if [[ "$RUNNER_OS" == Windows ]]; then extension=zip; fi
          cmake -E make_directory build/unpacked
          cmake -E chdir build/unpacked cmake -E tar xf "../packages/$PACKAGE_NAME.$extension"
          cmake -E rename "build/unpacked/$PACKAGE_NAME" build/stage

      - name: Check packaged FFmpeg
        run: |
          ffmpeg=build/stage/ffmpeg
          if [[ "$RUNNER_OS" == Windows ]]; then ffmpeg+=.exe; fi
          "$ffmpeg" -version
          "$ffmpeg" -decoders | grep -w xma2
          "$ffmpeg" -encoders | grep -w pcm_s16le

      - name: Smoke test Linux GUI
        if: runner.os == 'Linux'
        run: |
          set +e
          xvfb-run -a timeout 5s ./build/stage/pkzgui
          result=$?
          set -e
          test "$result" -eq 124

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkzgui-${{ matrix.platform }}
          path: |
            build/packages/*.zip
            build/packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkzgui-*
          merge-multiple: true
          path: packages

      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" packages/* --clobber
          else
            options=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" packages/* "${options[@]}"
          fi
