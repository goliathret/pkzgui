name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, shell: bash }
          - { platform: windows-x64, runner: windows-2022, shell: "msys2 {0}" }
          - { platform: macos-arm64, runner: macos-15, shell: bash }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libdbus-1-dev

      - if: runner.os == 'macOS'
        run: brew install ninja nasm

      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-nasm

      - name: Build FFmpeg
        working-directory: external/FFmpeg
        run: |
          ./configure --disable-autodetect --disable-ffplay --disable-ffprobe --disable-doc --disable-everything --enable-decoder=xma2 --enable-demuxer=wav --enable-muxer=wav --enable-encoder=pcm_s16le --enable-protocol=file --enable-filter=aresample,aformat,anull
          make -j4

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF
          cmake --build build --parallel
          cpack --config build/CPackConfig.cmake -D CPACK_PACKAGE_FILE_NAME=pkzgui-${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: pkzgui-${{ matrix.platform }}
          path: build/packages/pkzgui-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: packages

      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
